name: Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run lint
        run: npm run lint --max-warnings=0
        continue-on-error: true
      
      - name: Build
        run: npm run build
      
      - name: Deploy notification
        run: |
          echo "✅ Build success"
          echo "🚀 Vercel auto-deploying..."
